reviews:
  - text: >-
      A superb breakfast with delicious real scrambled egg! A very nice balcony,
      a great room and bed and a super efficient bathroom and a great location.
    nl: >-
      Een voortreffelijk ontbijt met heerlijk, echt roerei! Een heel fijn
      balkon, een geweldige kamer en een geweldig bed, een zeer efficiënte
      badkamer en een prima locatie.
    de: >-
      Ein hervorragendes Frühstück mit köstlichem, echtem Rührei! Ein sehr
      schöner Balkon, ein tolles Zimmer und Bett, ein super effizientes Bad und
      eine großartige Lage.
    score: 7
  - text: >-
      100% recommended. The reception staff were super friendly. Very good, I
      would return.
    nl: >-
      100% aan te raden. Het receptiepersoneel was supervriendelijk. Heel goed,
      ik zou terugkomen.
    de: >-
      100% zu empfehlen. Das Personal an der Rezeption war superfreundlich. Sehr
      gut, ich würde wiederkommen.
    score: 10
  - text: >-
      The area is great! Very close to town and easy connections, 4: It's just
      around the corner! I really appreciated the free drinks and snacks in the
      lobby!
    nl: >-
      De buurt is geweldig! Heel dicht bij het centrum en goede verbindingen, 4:
      die is om de hoek! Ik vond de gratis drankjes en snacks in de lobby echt
      fijn.
    de: >-
      Die Gegend ist großartig! Ganz nah an der Stadt und gute Verbindungen, 4:
      die ist gleich um die Ecke! Die kostenlosen Getränke und Snacks in der
      Lobby fand ich richtig gut.
    score: 7
  - text: >-
      The breakfast was excellent. The room is very clean and the staff showed
      professionalism. We want to give a big thanks to Mika (Receptionist) who
      was extremely helpful.
    nl: >-
      Het ontbijt was uitstekend. De kamer is heel schoon en het personeel was
      professioneel. Een groot bedankje aan Mika (receptie), die buitengewoon
      behulpzaam was.
    de: >-
      Das Frühstück war ausgezeichnet. Das Zimmer ist sehr sauber und das
      Personal war professionell. Ein großes Dankeschön an Mika (Rezeption) für
      die außerordentlich hilfsbereite Betreuung.
    score: 10
  - text: >-
      Balcony, Food, Area, Clean bed, Free drinks and snacks. What more do you
      want?
    nl: >-
      Balkon, eten, buurt, schoon bed, gratis drankjes en snacks. Wat wil je nog
      meer?
    de: >-
      Balkon, Essen, Gegend, sauberes Bett, kostenlose Getränke und Snacks. Was
      will man mehr?
    score: 9
  - text: >-
      The rooms had just been renovated, so everything was new. So a new
      bathroom, new bed, carpeting, etc. Breakfast was an extensive buffet.
      Super well taken care of. The location is excellent!
    nl: >-
      De kamers waren net gerenoveerd, dus alles was nieuw. Een nieuwe badkamer,
      nieuw bed, nieuwe vloerbedekking, enzovoort. Het ontbijt was een
      uitgebreid buffet. Super goed verzorgd. De locatie is uitstekend!
    de: >-
      Die Zimmer waren gerade renoviert worden, also war alles neu. Neues Bad,
      neues Bett, neuer Teppichboden und so weiter. Das Frühstück war ein
      reichhaltiges Buffet. Rundum super versorgt. Die Lage ist ausgezeichnet!
    score: 8
  - text: >-
      The staff were very friendly and always willing to help. The hotel has a
      very pleasant common area.
    nl: >-
      Het personeel was heel vriendelijk en altijd bereid te helpen. Het hotel
      heeft een heel prettige gemeenschappelijke ruimte.
    de: >-
      Das Personal war sehr freundlich und immer hilfsbereit. Das Hotel hat
      einen sehr angenehmen Gemeinschaftsbereich.
    score: 7
  - text: >-
      Very convenient location, large room. Classic Amsterdam building, very
      friendly staff, quick check-in.
    nl: >-
      Heel handige locatie, grote kamer. Klassiek Amsterdams pand, heel
      vriendelijk personeel, snelle check-in.
    de: >-
      Sehr praktische Lage, großes Zimmer. Klassisches Amsterdamer Gebäude, sehr
      freundliches Personal, schneller Check-in.
    score: 8
  - text: Hotel well located, attentive staff.
    nl: Hotel goed gelegen, attent personeel.
    de: Hotel gut gelegen, aufmerksames Personal.
    score: 8
  - text: >-
      The location was amazing! Super walkable to lots of parts of the city. I
      expected it to feel very "budget", but the rooms were well set up and
      clean, I couldn't hear my neighbors or street noise. The staff and
      breakfast were great.
    nl: >-
      De locatie was fantastisch! Veel van de stad is goed te belopen. Ik
      verwachtte een erg 'budget' gevoel, maar de kamers waren goed ingericht en
      schoon, en ik hoorde buren noch straatlawaai. Personeel en ontbijt waren
      top.
    de: >-
      Die Lage war fantastisch! Vieles ist gut zu Fuß erreichbar. Ich hatte
      etwas sehr 'Einfaches' erwartet, aber die Zimmer waren gut eingerichtet
      und sauber, und ich hörte weder Nachbarn noch Straßenlärm. Personal und
      Frühstück waren super.
    score: 9
  - text: >-
      Good beds with good pillows. Great location. Just a short walk, but
      quickly into the city. Free soft drinks available. Great breakfast.
      Despite the warm weather, the room was cool. The air conditioning worked
      well but was quite loud to sleep with.
    nl: >-
      Goede bedden met goede kussens. Prima locatie. Even lopen, maar je bent zo
      in de stad. Gratis frisdrank beschikbaar. Heerlijk ontbijt. Ondanks het
      warme weer bleef de kamer koel. De airco werkte goed, maar was nogal luid
      om bij te slapen.
    de: >-
      Gute Betten mit guten Kissen. Tolle Lage. Nur ein kurzer Weg, und man ist
      schnell in der Stadt. Kostenlose Softdrinks. Tolles Frühstück. Trotz des
      warmen Wetters blieb das Zimmer kühl. Die Klimaanlage funktionierte gut,
      war zum Schlafen aber ziemlich laut.
    score: 7
  - text: >-
      The lobby and breakfast were quite good. The bed was very comfortable and
      we had sort of a balcony that we did not expect which was nice. All staff
      were excellent, friendly and helpful, especially Taimoor who really went
      above and beyond to make our stay special! Check in was super fast and
      easy. Tram line and market right across the street. Many good restaurants
      nearby.
    nl: >-
      De lobby en het ontbijt waren best goed. Het bed was heel comfortabel en
      we hadden een soort balkon dat we niet hadden verwacht, wat fijn was. Al
      het personeel was uitstekend, vriendelijk en behulpzaam, vooral Taimoor,
      die echt een stap extra zette om ons verblijf bijzonder te maken!
      Inchecken ging supersnel en makkelijk. De tramlijn en de markt liggen aan
      de overkant. Veel goede restaurants in de buurt.
    de: >-
      Die Lobby und das Frühstück waren richtig gut. Das Bett war sehr bequem,
      und wir hatten eine Art Balkon, mit dem wir nicht gerechnet hatten, was
      schön war. Das gesamte Personal war ausgezeichnet, freundlich und
      hilfsbereit, allen voran Taimoor: hier wurde wirklich alles darangesetzt,
      unseren Aufenthalt besonders zu machen! Der Check-in ging superschnell und
      einfach. Tramlinie und Markt liegen direkt gegenüber. Viele gute
      Restaurants in der Nähe.
    score: 8
